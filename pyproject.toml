[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dens-city"
version = "0.1.0"
description = "High-Performance Molecular Classical Density Functional Theory Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "ExcessFreeEnergy" },
]
dependencies = [
    "tinygrad>=0.14.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pytest>=7.4.0",
    "pytest-xdist>=3.5.0",
    "pytest-benchmark>=4.0.0",
    "matplotlib>=3.7.0",
    "ruff>=0.4.0",
    "raylib>=5.0.0",
    "pyzmq>=25.0.0",
    "rdkit>=2023.9.1",
    "torch>=2.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.5",
    "mcp>=2.2.0",
]

[project.scripts]
dens-city = "dens_city.ui.cli:main"
"dens--city" = "dens_city.ui.cli:main"
dens-city-server = "dens_city.server.app:start_server"
dens-city-mcp = "dens_city.server.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dens_city.swarm.c_src" = ["*.c", "*.h", "*.ini"]
"dens_city.utils" = ["*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "gpu: tests requiring Tinygrad GPU execution, neural network training, or JIT benchmarks",
    "cpu: fast CPU unit tests safe for high-concurrency parallelization",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
